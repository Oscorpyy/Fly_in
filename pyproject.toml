[project]
name = "fly-in"
version = "0.1.0"
description = "Drones are interesting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyqt6>=6.7.0,<6.8.0",
    "pyqt6-3d>=6.7.0,<6.8.0",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.1.0",
]
[tool.mypy]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["PyQt6", "PyQt6.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "constant",
    "draw_graph",
    "main",
    "map",
    "menu",
    "terminal",
    "sources.*",
]
disallow_subclassing_any = false
warn_return_any = false